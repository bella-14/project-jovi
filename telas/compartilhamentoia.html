<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/output.css">

    <title>JOVI-Compartilhar</title>
</head>

<body class="bg-slate-900 min-h-screen text-white">
    <main class="mx-auto max-w-5x1 px-6 py-16">

        <header class="mb-16 text-center">
        <h1 class="inline-block border-1-4 border-cyan-400 pl-4 text-3x1 font-bold md:text-5x1 p-4">Compartilhamento IA</h1>
</header>

    <section class="grid items-center gap-14 lg:grid-cols-2">

        <h2 class="mb-6 text-center text-2xl font-bold text-purple-400 m-4 p-2">Legenda gerada por IA</h2>
        <p class="mx-auto mb-8 max-w-2x1 text-center leading-8 text-gray-300 p-2">por do sol incrivel na cidade hoje- cada detalhe capturado com precisao!#JOVI #SnapFlow</p>

        <div class="flex flex-wrap gap-3">
        <button class="rounded-lg bg-purple-700 px-4 py-2 p-2 text-sm font-semibold border border-slate-600">Usar esta</button>
        <button class="rounded-lg bg-purple-600 px-4 py-2 p-2 text-sm font-semibold border border-slate-600">Gerar outra</button>
        <button class="rounded-lg bg-purple-600 px-4 py-2 p-2 text-sm font-semibold border border-slate-600">Editar</button>
    </div>
    </section>

    <section class="mb-8 rounded-xl border border-cyan-400/30">
        <h3 class="mb-5 text-2xl font-bold text-cyan-400">IA recomendada para voce</h3>

        <div class="grid grid-cols-2 gap-2 lg-columns-4 p-6 mt-8">

        <button class="rounded-lg border border-pink-500/30 bg-pink-950/30 px-4 py-3 font-semibold">Instagram</button>
        <button class="rounded-lg border border-pink-500/30 bg-pink-950/30 px-4 py-3 font-semibold">WhatsApp</button>
        <button class="rounded-lg border border-pink-500/30 bg-pink-950/30 px-4 py-3 font-semibold">TikTok</button>
        <button class="rounded-lg border border-pink-500/30 bg-pink-950/30 px-4 py-3 font-semibold">Facebook</button>
</div>

    </section>

    <section>
        <h4 class="border border-slate-800 p-6 text-center ">Compreensao automatica</h4>
        <p class="text-4xl font-bold p-3">Reduz 68% sem perda visual</p>

        <label>
            <input type="checkbox" class="h-5 w-5 p-6 m-6 accent-cyan-400">
            Ativar compressao
        </label>
    </section>

    <section class="p-4">
        <button class="border border-purple-300 rounded-2xl">Compartilhar agora</button>
    </section>
</main>

</body>
</html>
