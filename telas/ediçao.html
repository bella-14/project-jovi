<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/output.css">
    <title>Ediçao assistida</title>
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <header class="border-b border-white/10 px-6 py-5">
        <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-4 md:flex-row">
        
        <h1 class="text-2xl font-bold tracking-wide text-cyan-400">JOVI</h1>
        <button>Salvar</button>
    </header>
</div>
    <main>
        <section>
            <a href="galeria.html">Voltar</a>
            <h2>Ediçao assistida</h2>
        </section>

        <section>
            <h3>JOVI sugere:</h3>
            <p>+12% brilho e filtro urbano para esta cena</p>
        </section>

        <section>
            <h3>sugestoes IA</h3>
            <div>
                <p>Aplicar correçao automatica de cor</p>
                <button>Aplicar</button>
            </div>
            <div>
                <p>Corte sugerido</p>
                <button>Aplicar</button>
            </div>
        </section>

        <section>
            <button>Urbano</button>
            <button>Natural</button>
            <button>Quente</button>
            <button>Frio</button>
            <button>P&B</button>
        </section>

        <section>
            <h3>Ajustes</h3>
            <label for="temperatura">
                temperatura

            </label input type="range" min="0" max="100" value="50">

            <label for="brilho">
                Brilho
            </label min="0" max="100" value="50">

            <label for="constrante">
                Constraste
            </label min="0" max="100" value="50">
        </section>

        <section>
            <h4>Estilos para redes sociais</h4>

            <button>Instagram</button>
            <button>Whatsapp</button>
            <button>Stories</button>
        </section>

        <section>
            <button>Salvar ediçao</button>
        </section>
    </main>
    
</body>
</html>
