<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/output.css">
    <title>JOVI- Captura Inteligente</title>
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <header class="flex items-center justify-between border-b border-slate-800 px-6 py-5">
        <h1 class="text-2xl font-bold tracking-wide text-white">JOVI</h1>

        <a href="./index.html"
        class="rounded-xl bg-sky-50 px-4 py-3 font-medium">Voltar</a>
    </header>

    <main class="mx-auto max-w-6x1 px-6 py-10">
        <section>
            
            <h2 class="mb-8 text-3xl font-bold text-cyan-400 md:text-4xl">Captura inteligente</h2>

            <div class="grid grid-cols-4 gap-4 ms:grid-cols-4 m-5">
                <div class="rounded-xl border border-slate-700 bg-slate-900 p-5">
                    <span class="text-sm text-slate-400">Iluminaçao</span>
                    <strong class="mt-2 block text-x1 text-cyan-400">Boa</strong>
                </div>

                <div class="rounded-xl borde border-slate-700 p-5">
                    <span class="text-sm text-slate-400">Exposiçao</span>
                    <strong class="mt-2 block text-x1">+0,3</strong>
                </div>

                <div class="rounded-xl border border-slate-700 p-5">
                    <span class="text-sm text-slate-400">Velocidade</span>
                    <strong class="mt-2 block text-x1">1/250s</strong>
                </div>

                <div class="rounded-xl border border-slate-700 p-5">
                    <span class="text-sm text-slate-400">ISO</span>
                    <strong class="mt-2 block text-x1">80</strong>
                </div>
            </div>

            <div class="p-50">
                <h3>JOVI sugere:</h3>      
            <p>Analisando o ambiente</p>
            </div>

            <div class="">
                <button>Capturar</button>
            </div>

        </section>
    </main>
</body>
</html>
